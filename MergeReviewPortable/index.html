<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merge Review · 合并确认</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><header><div class="brand">MERGE REVIEW <span>开发协作 / MERGE REVIEW</span></div><div class="live" id="connection" role="status">正在连接</div></header>
<main><section class="intro"><div><div class="eyebrow" id="date">分支合并</div><h1>先看清改动，再确认合并。</h1><p id="snapshot">正在读取会话</p><p class="muted">每个文件保留一条共享选择，后提交的人覆盖前一条；显示最后修改人，不会直接修改 Git。“两边都要”：以当前分支为基础，重放合入分支修改。</p></div><div class="identity"><label for="reviewer">你的姓名 / Git 账号</label><input id="reviewer" maxlength="60" placeholder="例如 chenlong" autocomplete="name"><small>姓名随最新选择一起保存；所有人修改同一条结果。</small></div></section>
<section id="stats" class="stats" aria-label="汇总"></section>
<section class="toolbar"><input type="search" id="search" placeholder="搜索文件、路径、提交人或提交号" aria-label="搜索"><select id="category" aria-label="分类"><option value="">全部分类</option></select><select id="status" aria-label="状态"><option value="">全部状态</option><option value="pending">尚未选择</option><option value="reviewed">已选择</option><option value="mine">我最后修改</option></select><a class="export back" id="back" href="../../" hidden>← 会话列表</a><button id="refresh">刷新</button><a class="export" href="api/review.md">检查文档 ↗</a><a class="export" href="api/export.csv">导出 CSV ↗</a></section>
<div class="list-head"><span id="count">正在加载冲突清单…</span><span>未选择优先 · 按文件夹排序 · 每 10 秒同步</span></div><div id="error" role="alert" hidden></div><div id="files"></div><footer>共享选择 · 以最后一次保存为准 · 本机服务运行期间可访问</footer></main><div id="toast" role="status" hidden></div></body></html>
